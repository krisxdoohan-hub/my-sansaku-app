    <script>
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }

        let dbInstance = null;
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('WalkRecordsDB', 1);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('recordsStore')) db.createObjectStore('recordsStore', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('queueStore')) db.createObjectStore('queueStore', { keyPath: 'id' });
                };
                request.onsuccess = (event) => { dbInstance = event.target.result; resolve(dbInstance); };
                request.onerror = (event) => reject(event.target.error);
            });
        }
        function dbGetAll(sName) { return new Promise((res, rej) => { if (!dbInstance) return res([]); const req = dbInstance.transaction(sName, 'readonly').objectStore(sName).getAll(); req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
        function dbPut(sName, item) { return new Promise((res, rej) => { if (!dbInstance) return rej(); const req = dbInstance.transaction(sName, 'readwrite').objectStore(sName).put(item); req.onsuccess = () => res(); req.onerror = () => rej(req.error); }); }
        function dbDelete(sName, id) { return new Promise((res, rej) => { if (!dbInstance) return rej(); const req = dbInstance.transaction(sName, 'readwrite').objectStore(sName).delete(id); req.onsuccess = () => res(); req.onerror = () => rej(req.error); }); }
        function dbClear(sName) { return new Promise((res, rej) => { if (!dbInstance) return rej(); const req = dbInstance.transaction(sName, 'readwrite').objectStore(sName).clear(); req.onsuccess = () => res(); req.onerror = () => rej(req.error); }); }

        // 統一在全域設定 GAS 網址，避免重複宣告錯誤
        var gasUrl = "https://script.google.com/macros/s/AKfycbwHggG23aVfGWEkwUeawvjhv65KEvJ8PPsVUBZV2ej_GKTdPEpiRhzqNPncdF5IHSle/exec";
        
        let records = []; 
        let currentViewDate = new Date(); 
        let editingRecordId = null;
        let hasUnsyncedChanges = false;
        let syncQueue = [];
        let currentReceiptBase64 = null;
        let isReceiptDeleted = false;
        let focusedInput = 'start';
        let currentView = 'list';

        window.currentUserUid = null;

        function getLocalYMD(d) { const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0'); return `${y}-${m}-${day}`; }
        function showLoading(t) { document.getElementById('loading-text').innerText = t; document.getElementById('loading-overlay').classList.replace('hidden', 'flex'); }
        function hideLoading() { document.getElementById('loading-overlay').classList.replace('flex', 'hidden'); }

        function updateCloudIcon(state) {
            const icon = document.getElementById('cloud-status-icon');
            if (state === 'success') { 
                icon.innerHTML = '<i class="ph ph-cloud-check text-2xl"></i>'; icon.className = 'text-emerald-500 transition-colors p-1.5 rounded-full hover:bg-emerald-50'; 
            } else if (state === 'unsynced') {
                icon.innerHTML = '<i class="ph ph-cloud-arrow-up text-2xl"></i>'; icon.className = 'text-amber-500 transition-colors p-1.5 rounded-full animate-pulse hover:bg-amber-50'; 
            } else { 
                icon.innerHTML = '<i class="ph ph-cloud-warning text-2xl"></i>'; icon.className = 'text-rose-400 transition-colors p-1.5 rounded-full hover:bg-rose-50'; 
            }
        }

        // --- 登入與註冊邏輯 ---
        async function handleFirebaseLogin() {
            const email = document.getElementById('fb-email').value;
            const password = document.getElementById('fb-password').value;
            const errorMsg = document.getElementById('fb-error-msg');
            if (!email || !password) { errorMsg.innerText = "請輸入信箱與密碼"; errorMsg.style.opacity = '1'; return; }
            
            showLoading("登入中...");
            try {
                await window.signInWithEmailAndPassword(window.firebaseAuth, email, password);
            } catch (error) {
                errorMsg.innerText = "登入失敗，請檢查帳號密碼";
                errorMsg.style.opacity = '1';
                hideLoading();
            }
        }

        async function handleFirebaseRegister() {
            const email = document.getElementById('fb-email').value;
            const password = document.getElementById('fb-password').value;
            const errorMsg = document.getElementById('fb-error-msg');
            if (!email || !password) { errorMsg.innerText = "請輸入信箱與密碼"; errorMsg.style.opacity = '1'; return; }
            
            showLoading("註冊中...");
            try {
                await window.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') errorMsg.innerText = "信箱已被註冊";
                else if (error.code === 'auth/weak-password') errorMsg.innerText = "密碼至少 6 個字元";
                else errorMsg.innerText = "註冊失敗";
                errorMsg.style.opacity = '1';
                hideLoading();
            }
        }

        async function handleFirebaseLogout() {
            try {
                await window.signOut(window.firebaseAuth);
                window.currentUserUid = null;
                records = [];
                await dbClear('recordsStore');
                window.location.reload();
            } catch (e) { alert("登出失敗"); }
        }

        function unlockApp() {
            hideLoading();
            const overlay = document.getElementById('lock-screen');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            overlay.style.transform = "scale(1.1)";
            setTimeout(() => { overlay.classList.add('hidden'); overlay.classList.remove('flex'); }, 400);
        }

        function lockApp() {
            hideLoading();
            const overlay = document.getElementById('lock-screen');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            requestAnimationFrame(() => {
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                overlay.style.transform = "scale(1)";
            });
        }

        async function init() {
            try {
                await initDB();
            } catch (error) { console.error("本地DB載入失敗", error); }

            const ADMIN_UID = "zWeaVysdinQwVhX70x8OWQfaUAg2"; // 您的專屬主揪 UID

            window.onAuthStateChanged(window.firebaseAuth, async (user) => {
                if (user) {
                    if (user.uid !== ADMIN_UID) {
                        alert("抱歉，您不是授權的主揪帳號，無法使用此系統。");
                        await window.signOut(window.firebaseAuth);
                        return;
                    }
                    window.currentUserUid = user.uid;
                    unlockApp();
                    
                    // 登入後載入快取與同步
                    records = await dbGetAll('recordsStore') || [];
                    syncQueue = await dbGetAll('queueStore') || [];
                    if (syncQueue.length > 0) hasUnsyncedChanges = true;
                    
                    renderAll();
                    forceSyncDownload();
                    processSyncQueue();
                } else {
                    lockApp();
                }
            });

            window.addEventListener('online', processSyncQueue);
        }

        function setView(v) {
            currentView = v;
            const btnList = document.getElementById('btn-view-list');
            const btnChart = document.getElementById('btn-view-chart');
            const divList = document.getElementById('view-list');
            const divChart = document.getElementById('view-chart');

            if (v === 'list') {
                btnList.className = "flex-1 py-1.5 text-xs font-bold rounded-full bg-white text-amber-700 shadow-sm transition-all";
                btnChart.className = "flex-1 py-1.5 text-xs font-bold rounded-full text-amber-600 hover:text-amber-800 transition-all";
                divList.classList.remove('hidden'); divChart.classList.add('hidden');
                divChart.classList.remove('grid');
            } else {
                btnChart.className = "flex-1 py-1.5 text-xs font-bold rounded-full bg-white text-amber-700 shadow-sm transition-all";
                btnList.className = "flex-1 py-1.5 text-xs font-bold rounded-full text-amber-600 hover:text-amber-800 transition-all";
                divList.classList.add('hidden'); divChart.classList.remove('hidden');
                divChart.classList.add('grid');
                renderCharts();
            }
        }

        function renderAll() {
            const y = currentViewDate.getFullYear();
            const m = String(currentViewDate.getMonth() + 1).padStart(2, '0');
            const d = String(currentViewDate.getDate()).padStart(2, '0');
            document.getElementById('currentYearDisplay').innerText = `${y} 年`;
            document.getElementById('currentDateDisplay').innerText = `${m}月${d}日`;
            
            const today = new Date();
            const btn = document.getElementById('backTodayBtn');
            if(y === today.getFullYear() && m === String(today.getMonth() + 1).padStart(2, '0') && d === String(today.getDate()).padStart(2, '0')) {
                btn.classList.add('hidden');
            } else {
                btn.classList.remove('hidden');
            }

            renderHistory();
            if (currentView === 'chart') renderCharts();
        }

        function changeDate(delta) { currentViewDate.setDate(currentViewDate.getDate() + delta); renderAll(); }
        function resetToToday() { currentViewDate = new Date(); renderAll(); }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const targetDate = getLocalYMD(currentViewDate);
            const targetRecords = records.filter(r => r.date === targetDate).sort((a,b) => a.time.localeCompare(b.time));
            
            if(targetRecords.length === 0) { list.innerHTML = `<div class="bg-white/70 backdrop-blur-sm rounded-2xl p-10 text-center text-amber-600/60 font-bold text-sm border border-amber-100 border-dashed shadow-sm">這一天還沒有散策紀錄喔</div>`; return; }
            
            let html = '';
            targetRecords.forEach(r => {
                const trIcon = r.transport === '步行' ? 'ph-sneaker text-emerald-500 bg-emerald-50' : 
                               r.transport === '捷運' ? 'ph-train text-blue-500 bg-blue-50' : 
                               r.transport === '公車' ? 'ph-bus text-amber-500 bg-amber-50' : 
                               r.transport === '自行車' ? 'ph-bicycle text-teal-500 bg-teal-50' : 'ph-train-regional text-indigo-500 bg-indigo-50';
                
                const receiptIcon = (r.receipt_image || r.receipt_url) ? '<i class="ph ph-image text-amber-400 ml-1"></i>' : '';

                html += `
                <div onclick="editRecord('${r.id}')" class="bg-white/90 backdrop-blur-sm p-4 rounded-2xl shadow-sm border border-amber-100 hover:bg-amber-50 active:scale-[0.98] cursor-pointer transition-all flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full flex items-center justify-center flex-shrink-0 ${trIcon} border border-white shadow-inner">
                            <i class="ph ${trIcon.split(' ')[0]} text-xl"></i>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-amber-500 mb-0.5">${r.time}</p>
                            <p class="text-sm font-black text-stone-800 flex items-center gap-1.5">${r.start_point} <i class="ph ph-arrow-right text-stone-400 text-xs"></i> ${r.end_point} ${receiptIcon}</p>
                            <p class="text-xs font-bold text-stone-400 truncate max-w-[150px] mt-0.5">${r.note || ''}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-bold text-stone-400 mb-0.5">區間步數</p>
                        <span class="text-lg font-black text-rose-500">${(r.segment_steps || 0).toLocaleString()}</span>
                    </div>
                </div>`;
            });
            list.innerHTML = html;
        }

        function renderCharts() {
            const targetDate = getLocalYMD(currentViewDate);
            const targetRecords = records.filter(r => r.date === targetDate);
            const pieContainer = document.getElementById('transport-pie');
            const legendContainer = document.getElementById('transport-legend');
            const barContainer = document.getElementById('steps-bar-container');

            if(targetRecords.length === 0) {
                pieContainer.style.background = '#f5f5f4';
                legendContainer.innerHTML = '無資料';
                barContainer.innerHTML = '<div class="w-full text-center text-amber-400 font-bold text-xs mt-10">無步數資料</div>';
                return;
            }

            const trCounts = {};
            targetRecords.forEach(r => trCounts[r.transport] = (trCounts[r.transport] || 0) + 1);
            const colors = {'步行': '#10b981', '捷運': '#3b82f6', '公車': '#f59e0b', '火車/高鐵': '#6366f1', '自行車': '#14b8a6'};
            
            let conicStops = [], currentDeg = 0, legendHtml = '';
            const totalTR = targetRecords.length;
            
            Object.entries(trCounts).forEach(([tr, count]) => {
                const deg = (count / totalTR) * 360;
                const color = colors[tr] || '#9ca3af';
                conicStops.push(`${color} ${currentDeg}deg ${currentDeg + deg}deg`);
                currentDeg += deg;
                legendHtml += `<span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full" style="background:${color}"></span>${tr} (${count})</span>`;
            });
            pieContainer.style.background = `conic-gradient(${conicStops.join(', ')})`;
            legendContainer.innerHTML = legendHtml;

            let maxSteps = Math.max(...targetRecords.map(r => r.segment_steps || 0));
            if (maxSteps === 0) maxSteps = 1000;
            
            let barHtml = '';
            targetRecords.forEach(r => {
                const heightPct = Math.max(10, ((r.segment_steps || 0) / maxSteps) * 100);
                barHtml += `
                <div class="flex flex-col items-center justify-end h-full min-w-[40px] group relative">
                    <span class="text-[9px] font-bold text-amber-600 mb-1 absolute -top-4 opacity-0 group-hover:opacity-100 transition-opacity bg-white px-1 rounded shadow-sm whitespace-nowrap z-10">${r.segment_steps}</span>
                    <div class="w-6 bg-gradient-to-t from-amber-500 to-amber-300 rounded-t-sm shadow-sm transition-all group-hover:opacity-80" style="height: ${heightPct}%"></div>
                    <span class="text-[8px] font-bold text-stone-400 mt-2 truncate w-full text-center px-1" title="${r.start_point}">${r.start_point.substring(0,2)}</span>
                </div>`;
            });
            barContainer.innerHTML = barHtml;
        }

        function setFocus(id) { focusedInput = id; }

        function renderQuickTags() {
            const personalDefaults = ["捷運迴龍站", "台北 SOGO", "捷運忠孝新生站", "新莊中正路"];
            const allPoints = records.flatMap(r => [r.start_point, r.end_point]).filter(Boolean);
            const recentPoints = [...new Set(allPoints)].reverse().slice(0, 5);
            let uniquePoints = [...new Set([...recentPoints, ...personalDefaults])].slice(0, 6);

            let html = '';
            uniquePoints.forEach(p => {
                html += `<button type="button" onclick="insertTag('${p}')" class="px-3 py-1 bg-white text-amber-700 rounded-full text-[11px] font-black border border-amber-200 shadow-sm hover:bg-amber-50 active:scale-95 transition focus:outline-none tracking-wide">${p}</button>`;
            });
            document.getElementById('quick-tags-container').innerHTML = html;
        }

        function insertTag(val) {
            const input = document.getElementById(`input-${focusedInput}`);
            input.value = val;
            input.focus();
        }

        function autoFillStartPoint() {
            if (editingRecordId) return; 
            const dateStr = document.getElementById('input-date').value;
            const sortedRecords = records.filter(r => r.date === dateStr).sort((a,b) => a.time.localeCompare(b.time));
            if (sortedRecords.length > 0) {
                document.getElementById('input-start').value = sortedRecords[sortedRecords.length - 1].end_point;
            } else {
                document.getElementById('input-start').value = '';
            }
        }

        function calculateSegmentSteps() {
            const currentCumul = parseInt(document.getElementById('input-cumul-steps').value) || 0;
            if (currentCumul === 0) {
                document.getElementById('display-seg-steps').innerText = '0';
                return;
            }
            const dateStr = document.getElementById('input-date').value;
            const todaysRecords = records.filter(r => r.date === dateStr).sort((a,b) => a.time.localeCompare(b.time));
            
            let lastCumul = 0;
            const otherRecords = todaysRecords.filter(r => r.id !== editingRecordId);
            if (otherRecords.length > 0) {
                const currentTime = document.getElementById('input-time').value || "23:59";
                const earlierRecords = otherRecords.filter(r => r.time <= currentTime);
                if (earlierRecords.length > 0) {
                    lastCumul = earlierRecords[earlierRecords.length - 1].cumulative_steps || 0;
                }
            }
            const seg = Math.max(0, currentCumul - lastCumul);
            document.getElementById('display-seg-steps').innerText = seg.toLocaleString();
            return seg;
        }

        function openAddModal() {
            editingRecordId = null;
            document.getElementById('modalTitle').innerHTML = '<i class="ph ph-map-pin text-amber-500"></i> 新增散策段落';
            document.getElementById('btn-delete').classList.add('hidden');
            
            document.getElementById('input-date').value = getLocalYMD(currentViewDate);
            const now = new Date();
            document.getElementById('input-time').value = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
            
            document.getElementById('input-start').value = '';
            document.getElementById('input-end').value = '';
            document.getElementById('input-cumul-steps').value = '';
            document.getElementById('display-seg-steps').innerText = '0';
            document.getElementById('input-note').value = '';
            document.getElementById('input-transport').value = '步行';
            isReceiptDeleted = false;
            clearReceipt(false);
            
            autoFillStartPoint();
            renderQuickTags();
            
            const m = document.getElementById('addRecordModal'), c = document.getElementById('addRecordContent');
            m.classList.remove('hidden'); m.classList.add('flex');
            requestAnimationFrame(() => { m.classList.remove('opacity-0'); c.classList.remove('translate-y-full'); });
        }

        function editRecord(id) {
            editingRecordId = String(id);
            const r = records.find(x => String(x.id) === String(id));
            if(!r) return;
            
            document.getElementById('modalTitle').innerHTML = '<i class="ph ph-pencil-simple text-amber-500"></i> 編輯軌跡';
            document.getElementById('btn-delete').classList.remove('hidden');
            
            document.getElementById('input-date').value = r.date;
            document.getElementById('input-time').value = r.time;
            document.getElementById('input-start').value = r.start_point;
            document.getElementById('input-end').value = r.end_point;
            document.getElementById('input-transport').value = r.transport;
            document.getElementById('input-cumul-steps').value = r.cumulative_steps || '';
            document.getElementById('input-note').value = r.note || '';
            
            isReceiptDeleted = false;
            
            calculateSegmentSteps();
            renderQuickTags();
            clearReceipt(false);

            if (r.receipt_image || r.receipt_url) {
                const previewImg = document.getElementById('receipt-preview');
                currentReceiptBase64 = r.receipt_image;
                let viewUrl = r.receipt_image || r.receipt_url;
                if (viewUrl.includes('/file/d/')) {
                    const fileId = viewUrl.split('/d/')[1].split('/')[0];
                    viewUrl = `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
                }
                previewImg.src = viewUrl;
                document.getElementById('receipt-name').innerText = "已附加照片";
                document.getElementById('receipt-preview-container').classList.remove('hidden');
                document.getElementById('receipt-preview-container').classList.add('flex');
            }
            
            const m = document.getElementById('addRecordModal'), c = document.getElementById('addRecordContent');
            m.classList.remove('hidden'); m.classList.add('flex');
            requestAnimationFrame(() => { m.classList.remove('opacity-0'); c.classList.remove('translate-y-full'); });
        }

        function closeAddModal() {
            const m = document.getElementById('addRecordModal'), c = document.getElementById('addRecordContent');
            m.classList.add('opacity-0'); c.classList.add('translate-y-full');
            setTimeout(() => { m.classList.add('hidden'); m.classList.remove('flex'); }, 300);
        }

        function handleReceiptUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200;
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    currentReceiptBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    
                    document.getElementById('receipt-preview').src = currentReceiptBase64;
                    document.getElementById('receipt-preview-container').classList.remove('hidden');
                    document.getElementById('receipt-preview-container').classList.add('flex');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearReceipt(isUserAction = false) {
            currentReceiptBase64 = null;
            if (isUserAction) {
                isReceiptDeleted = true;
            }
            document.getElementById('input-receipt').value = '';
            document.getElementById('receipt-preview-container').classList.add('hidden');
            document.getElementById('receipt-preview-container').classList.remove('flex');
        }

        async function firestoreWriteRecord(record) {
            if (!window.db || !window.currentUserUid) throw new Error("Firestore 未就緒");
            const cleanRecord = { ...record };
            delete cleanRecord.receipt_image; 
            cleanRecord.updatedAt = window.fsServerTimestamp();
            const docRef = window.fsDoc(window.db, 'users', window.currentUserUid, 'walks', String(record.id));
            await window.fsSetDoc(docRef, cleanRecord, { merge: true });
        }

        async function firestoreDeleteRecord(recordId) {
            if (!window.db || !window.currentUserUid) throw new Error("Firestore 未就緒");
            const docRef = window.fsDoc(window.db, 'users', window.currentUserUid, 'walks', String(recordId));
            await window.fsDeleteDoc(docRef);
        }

        async function processSyncQueue() {
            if (syncQueue.length === 0 || !navigator.onLine || !window.db || !window.currentUserUid) return;
            updateCloudIcon('unsynced');
            const currentQueue = [...syncQueue];
            const successIds = [];

            for (const queueItem of currentQueue) {
                try {
                    const p = queueItem.payload;
                    if (p.action === 'delete') await firestoreDeleteRecord(p.id);
                    else await firestoreWriteRecord(p);
                    successIds.push(queueItem.id);
                } catch (err) { console.error("同步重試失敗", err); }
            }

            for (const sid of successIds) {
                syncQueue = syncQueue.filter(q => q.id !== sid);
                await dbDelete('queueStore', sid);
            }

            if (syncQueue.length === 0) { hasUnsyncedChanges = false; updateCloudIcon('success'); }
            else updateCloudIcon('error');
        }

        async function enqueueSyncItem(payload) {
            const queueItem = { id: Date.now().toString() + Math.random().toString(36).substring(2, 6), payload: payload };
            syncQueue.push(queueItem);
            await dbPut('queueStore', queueItem);
            hasUnsyncedChanges = true;
            updateCloudIcon('unsynced');
            if (navigator.onLine) processSyncQueue();
        }

        async function saveRecord() {
            const d = document.getElementById('input-date').value;
            const t = document.getElementById('input-time').value;
            const st = document.getElementById('input-start').value.trim();
            const ed = document.getElementById('input-end').value.trim();
            const tr = document.getElementById('input-transport').value;
            const cSteps = parseInt(document.getElementById('input-cumul-steps').value) || 0;
            const sSteps = calculateSegmentSteps();
            const n = document.getElementById('input-note').value;

            if (!d || !t || !st || !ed) { alert("日期、時間、起點與終點皆為必填！"); return; }

            const recordId = editingRecordId || Date.now().toString();
            const existingRecord = editingRecordId ? records.find(r => String(r.id) === String(editingRecordId)) : null;

            const newRecord = { 
                id: recordId, 
                date: d, time: t, 
                start_point: st, end_point: ed, transport: tr,
                cumulative_steps: cSteps, segment_steps: sSteps,
                note: n, 
                receipt_image: currentReceiptBase64,
                receipt_url: isReceiptDeleted ? null : (existingRecord ? existingRecord.receipt_url : null),
                rev: existingRecord ? (existingRecord.rev || 0) + 1 : 1
            };

            if(editingRecordId) {
                const idx = records.findIndex(r => r.id === editingRecordId);
                if(idx !== -1) records[idx] = newRecord;
            } else { records.push(newRecord); }
            
            await dbPut('recordsStore', newRecord);
            
            showLoading("同步至試算表與雲端中...");

            try {
                const response = await fetch(gasUrl, {
                    method: 'POST',
                    body: JSON.stringify({
                        uid: window.currentUserUid,
                        id: recordId,
                        action: 'save',
                        date: d,
                        time: t,
                        start_point: st,
                        end_point: ed,
                        transport: tr,
                        segment_steps: sSteps,
                        note: n,
                        receipt_image: currentReceiptBase64,
                        delete_receipt: isReceiptDeleted
                    })
                });
                
                const result = await response.json();
                
                if (result.status === "success" && result.imageUrl) {
                    newRecord.receipt_url = result.imageUrl;
                    await dbPut('recordsStore', newRecord);
                } else if (result.status === "error") {
                    console.error("GAS 內部錯誤:", result.message);
                    alert("試算表寫入失敗，請檢查 GAS 權限或錯誤紀錄：" + result.message);
                    hideLoading();
                    return; 
                }
            } catch (err) {
                console.error("GAS 請求失敗 (可能是 CORS 或網路問題):", err);
                alert("無法連線至 Google 試算表，圖片可能遺失，請確認 GAS 部署狀態與權限。");
                hideLoading();
                return; 
            }

            updateCloudIcon('unsynced');
            try {
                if (navigator.onLine && window.db && window.currentUserUid) {
                    await firestoreWriteRecord(newRecord);
                    hasUnsyncedChanges = false;
                    updateCloudIcon('success');
                } else { await enqueueSyncItem({ ...newRecord, action: 'save' }); }
            } catch (error) { await enqueueSyncItem({ ...newRecord, action: 'save' }); }
            
            hideLoading();
            closeAddModal();
            renderAll();
        }

        async function executeDelete() {
            if (!editingRecordId) return;
            const targetId = editingRecordId;
            records = records.filter(r => r.id !== targetId);
            await dbDelete('recordsStore', targetId);
            closeAddModal();
            renderAll();

            fetch(gasUrl, {
                method: 'POST',
                body: JSON.stringify({
                    uid: window.currentUserUid,
                    id: targetId,
                    action: 'delete'
                })
            }).catch(err => console.error("GAS 刪除失敗:", err));

            updateCloudIcon('unsynced');
            try {
                if (navigator.onLine && window.db && window.currentUserUid) {
                    await firestoreDeleteRecord(targetId);
                    hasUnsyncedChanges = false;
                    updateCloudIcon('success');
                } else { await enqueueSyncItem({ id: targetId, action: 'delete' }); }
            } catch (error) { await enqueueSyncItem({ id: targetId, action: 'delete' }); }
        }

        async function forceSyncDownload() {
            if (!window.db || !window.currentUserUid) return;
            if (hasUnsyncedChanges) { alert("尚有本地變更未上傳，暫停下載覆蓋"); return; }
            showLoading("雲端同步中...");
            try {
                const colRef = window.fsCollection(window.db, 'users', window.currentUserUid, 'walks');
                const snap = await window.fsGetDocs(colRef);
                records = [];
                snap.forEach(docSnap => {
                    const r = { id: String(docSnap.id), ...docSnap.data() };
                    records.push(r);
                });
                await dbClear('recordsStore');
                for (const r of records) await dbPut('recordsStore', r);
                updateCloudIcon('success');
                renderAll();
            } catch (error) {
                console.error("同步失敗", error);
                updateCloudIcon('error');
            } finally { hideLoading(); }
        }

        window.onload = init;
    </script>
